<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AK-777 PRO HUB</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 12px; }
    .app { max-width: 440px; margin: 0 auto; background: #131c31; border: 1px solid #24324d; border-radius: 14px; padding: 14px; }
    .top { display: flex; justify-content: space-between; align-items: center; background: #0b1120; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    .wallet { background: #052e16; color: #4ade80; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 12px; }
    .tab-btn { padding: 8px 4px; border: 1px solid #263552; background: #0b1120; color: #cbd5e1; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .tab-btn.active { background: #38bdf8; color: #062033; border-color: #38bdf8; }
    .panel { display: none; }
    .panel.active { display: block; }
    label { display: block; margin-top: 8px; font-size: 13px; color: #cbd5e1; }
    input, select { width: 100%; padding: 9px; margin-top: 4px; border-radius: 8px; border: 1px solid #2a3a58; background: #0b1120; color: #fff; font-size: 14px; }
    button.act { width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .g { background: #22c55e; color: #052e16; }
    .b { background: #38bdf8; color: #062033; }
    .a { background: #f59e0b; color: #1f1300; }
    .r { background: #ef4444; color: #fff; }
    .mini { padding: 4px 8px; font-size: 11px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .box { background: #070c18; border: 1px solid #233352; border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 10px; }
    .mult { font-size: 36px; font-weight: 900; color: #4ade80; }
    .mult.crash { color: #f87171; }
    #qrBox { margin-top: 12px; background: #fff; color: #0f172a; padding: 12px; border-radius: 10px; display: none; flex-direction: column; align-items: center; }
    .uri { margin-top: 8px; font-size: 11px; word-break: break-all; color: #475569; text-align: center; }
    .item { background: #0b1120; border-left: 3px solid #38bdf8; padding: 8px; border-radius: 8px; margin-top: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .msg { font-size: 12px; color: #93c5fd; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <b style="color:#38bdf8">AK-777 PRO HUB</b>
      <span class="wallet" id="bal">₹500.00</span>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;margin-bottom:10px;">
      <span id="who">Guest</span>
      <button class="mini b" id="logoutBtn" onclick="doLogout()" style="display:none;">Logout</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-t="games" onclick="tab('games')">Games</button>
      <button class="tab-btn" data-t="qr" onclick="tab('qr')">UPI QR</button>
      <button class="tab-btn" data-t="wd" onclick="tab('wd')">Withdraw</button>
      <button class="tab-btn" data-t="auth" onclick="tab('auth')">OTP ID</button>
    </div>

    <div class="panel active" id="p-games">
      <h3 style="margin:0 0 8px;color:#38bdf8">Aviator Crash</h3>
      <div class="box">
        <div id="cst" style="font-size:12px;color:#94a3b8">Ready</div>
        <div class="mult" id="mtxt">1.00x</div>
        <div id="cwin" style="font-size:12px">Cashout: ₹0.00</div>
      </div>
      <label>Bet (₹)</label>
      <input type="number" id="cbet" value="50" min="1" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button class="act g" id="cstart" onclick="startCrash()">Start / Bet</button>
        <button class="act a" id="ccash" onclick="cashCrash()" disabled>Cashout</button>
      </div>
      <div class="msg" id="cmsg"></div>

      <div style="background:#0b1120;padding:10px;border-radius:10px;margin-top:12px;">
        <h3 style="margin:0 0 8px;color:#38bdf8">Lucky Dice (1-6)</h3>
        <label>Number</label>
        <select id="dpick">
          <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        </select>
        <label>Bet (₹)</label>
        <input type="number" id="dbet" value="20" min="1" />
        <button class="act b" onclick="rollDice()">Roll (4x)</button>
        <div class="msg" id="dmsg"></div>
      </div>
    </div>

    <div class="panel" id="p-qr">
      <h3 style="margin:0 0 8px;color:#38bdf8">असली UPI QR</h3>
      <label>UPI ID</label>
      <input type="text" id="upi" placeholder="name@ibl" />
      <label>Name</label>
      <input type="text" id="pname" placeholder="Rafik Ali" />
      <label>Amount (₹)</label>
      <input type="number" id="amt" placeholder="100" min="1" />
      <label>Note</label>
      <input type="text" id="note" placeholder="Order1" />
      <button class="act g" onclick="makeQR()">QR बनाएं</button>
      <button class="act b" onclick="addDep()">Balance में ₹ जोड़ें</button>
      <div id="qrBox">
        <div id="qrcode"></div>
        <div class="uri" id="utxt"></div>
      </div>
    </div>

    <div class="panel" id="p-wd">
      <h3 style="margin:0 0 8px;color:#38bdf8">Withdrawal</h3>
      <label>Withdrawal UPI ID</label>
      <input type="text" id="wupi" placeholder="user@ybl" />
      <label>Amount (₹)</label>
      <input type="number" id="wamt" placeholder="100" min="1" />
      <button class="act b" onclick="addWd()">Withdraw Request</button>
      <div class="msg" id="wmsg"></div>
      <div id="wlist"></div>
    </div>

    <div class="panel" id="p-auth">
      <h3 style="margin:0 0 8px;color:#38bdf8">OTP ID / Login</h3>
      <label>Mobile / User ID</label>
      <input type="text" id="aid" placeholder="8595159725" />
      <label>Password</label>
      <input type="password" id="apass" placeholder="4+ अक्षर" />
      <button class="act a" onclick="sendOtp()">OTP भेजें (नई ID)</button>

      <div id="obox" style="display:none;background:#172554;border:1px solid #60a5fa;padding:10px;border-radius:8px;margin-top:10px;">
        <div id="otxt" style="font-weight:700;color:#bfdbfe;margin-bottom:6px;"></div>
        <input type="text" id="oinp" maxlength="6" placeholder="6-digit OTP डालें" />
        <button class="act g" onclick="verOtp()">Verify & ID बनाएं</button>
      </div>

      <button class="act b" onclick="doLogin()">बनी ID से Login</button>
      <div class="msg" id="amsg"></div>
    </div>
  </div>

  <script>
    const K = "ak777_clean_v1";
    const def = { bal: 500, user: null, users: {}, wds: [] };
    let s = JSON.parse(localStorage.getItem(K) || "null") || JSON.parse(JSON.stringify(def));
    let otp = null, pend = null, tm = null, m = 1, cp = 1, b = 0, fly = false;

    function save() {
      if (s.user && s.users[s.user]) s.users[s.user].bal = s.bal;
      localStorage.setItem(K, JSON.stringify(s));
      draw();
    }

    function draw() {
      document.getElementById("bal").innerText = "₹" + Number(s.bal).toFixed(2);
      document.getElementById("who").innerText = s.user ? ("Logged in: " + s.user) : "Guest";
      document.getElementById("logoutBtn").style.display = s.user ? "inline-block" : "none";

      const wl = document.getElementById("wlist");
      wl.innerHTML = "";
      s.wds.forEach((x) => {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `<div><b>#${x.id}</b> ₹${x.amt} → <code>${x.upi}</code><br/><b>${x.st}</b></div><div>${x.st === "Pending" ? `<button class="mini g" onclick="updWd('${x.id}','Paid')">Paid</button> <button class="mini r" onclick="updWd('${x.id}','Cancelled')">Cancel</button>` : ""}</div>`;
        wl.appendChild(d);
      });
    }

    function tab(n) {
      document.querySelectorAll(".tab-btn").forEach((el) => el.classList.toggle("active", el.dataset.t === n));
      document.querySelectorAll(".panel").forEach((el) => el.classList.toggle("active", el.id === "p-" + n));
    }

    function startCrash() {
      if (fly) return;
      const bet = Number(document.getElementById("cbet").value);
      if (!bet || bet <= 0 || bet > s.bal) {
        document.getElementById("cmsg").innerText = "सही Bet या Balance चेक करें";
        return;
      }
      s.bal = +(s.bal - bet).toFixed(2);
      save();
      b = bet; m = 1; fly = true;
      cp = +(1.15 + Math.pow(Math.random(), 2) * 5).toFixed(2);

      document.getElementById("cstart").disabled = true;
      document.getElementById("ccash").disabled = false;
      document.getElementById("mtxt").classList.remove("crash");
      document.getElementById("cst").innerText = "Flying...";
      document.getElementById("cmsg").innerText = "";

      tm = setInterval(() => {
        m = +(m + 0.04).toFixed(2);
        document.getElementById("mtxt").innerText = m.toFixed(2) + "x";
        document.getElementById("cwin").innerText = "Cashout: ₹" + (b * m).toFixed(2);

        if (m >= cp) {
          clearInterval(tm);
          fly = false; b = 0;
          document.getElementById("mtxt").innerText = cp.toFixed(2) + "x";
          document.getElementById("mtxt").classList.add("crash");
          document.getElementById("cst").innerText = "Crashed!";
          document.getElementById("cwin").innerText = "Cashout: ₹0.00";
          document.getElementById("cstart").disabled = false;
          document.getElementById("ccash").disabled = true;
          document.getElementById("cmsg").innerText = "क्रैश " + cp.toFixed(2) + "x";
        }
      }, 90);
    }

    function cashCrash() {
      if (!fly || !b) return;
      clearInterval(tm);
      const w = +(b * m).toFixed(2);
      s.bal = +(s.bal + w).toFixed(2);
      save();
      fly = false; b = 0;
      document.getElementById("cst").innerText = "Cashed Out!";
      document.getElementById("cwin").innerText = "Won: ₹" + w.toFixed(2);
      document.getElementById("cstart").disabled = false;
      document.getElementById("ccash").disabled = true;
      document.getElementById("cmsg").innerText = "जीते ₹" + w.toFixed(2);
    }

    function rollDice() {
      const p = Number(document.getElementById("dpick").value);
      const bet = Number(document.getElementById("dbet").value);
      if (!bet || bet <= 0 || bet > s.bal) {
        document.getElementById("dmsg").innerText = "सही Bet या Balance चेक करें";
        return;
      }
      s.bal = +(s.bal - bet).toFixed(2);
      const r = Math.floor(Math.random() * 6) + 1;
      if (r === p) {
        const w = +(bet * 4).toFixed(2);
        s.bal = +(s.bal + w).toFixed(2);
        document.getElementById("dmsg").innerText = `Rolled ${r}! जीते ₹${w}`;
      } else {
        document.getElementById("dmsg").innerText = `Rolled ${r} (आपका ${p})`;
      }
      save();
    }

    function makeQR() {
      const pa = document.getElementById("upi").value.trim().toLowerCase();
      if (!pa.includes("@")) { alert("सही UPI ID डालें"); return; }
      const q = new URLSearchParams({ pa, cu: "INR" });
      const pn = document.getElementById("pname").value.trim();
      const am = Number(document.getElementById("amt").value);
      const tn = document.getElementById("note").value.trim();
      if (pn) q.set("pn", pn);
      if (am > 0) q.set("am", am.toFixed(2));
      if (tn) q.set("tn", tn);
      const uri = "upi://pay?" + q.toString();
      const qrEl = document.getElementById("qrcode");
      qrEl.innerHTML = "";
      new QRCode(qrEl, { text: uri, width: 180, height: 180 });
      document.getElementById("utxt").innerText = uri;
      document.getElementById("qrBox").style.display = "flex";
    }

    function addDep() {
      const v = Number(document.getElementById("amt").value) || 100;
      s.bal = +(s.bal + v).toFixed(2);
      save();
      alert("₹" + v + " जुड़ गया");
    }

    function addWd() {
      const u = document.getElementById("wupi").value.trim().toLowerCase();
      const v = Number(document.getElementById("wamt").value);
      if (!u.includes("@") || !v || v <= 0) {
        document.getElementById("wmsg").innerText = "सही UPI और रकम डालें";
        return;
      }
      if (v > s.bal) {
        document.getElementById("wmsg").innerText = "Balance कम है";
        return;
      }
      s.bal = +(s.bal - v).toFixed(2);
      s.wds.unshift({ id: "WD" + Date.now().toString().slice(-5), upi: u, amt: v.toFixed(2), st: "Pending" });
      save();
      document.getElementById("wmsg").innerText = "रिक्वेस्ट सेव हो गई";
      document.getElementById("wupi").value = "";
      document.getElementById("wamt").value = "";
    }

    function updWd(id, st) {
      const x = s.wds.find((i) => i.id === id);
      if (!x) return;
      if (st === "Cancelled" && x.st === "Pending") s.bal = +(s.bal + Number(x.amt)).toFixed(2);
      x.st = st;
      save();
    }

    function sendOtp() {
      const id = document.getElementById("aid").value.trim();
      const pw = document.getElementById("apass").value.trim();
      if (!id || pw.length < 4) {
        document.getElementById("amsg").innerText = "ID और कम से कम 4 अक्षर का Password डालें";
        return;
      }
      otp = String(Math.floor(100000 + Math.random() * 900000));
      pend = { id, pw };
      document.getElementById("otxt").innerText = "आपका OTP है: " + otp;
      document.getElementById("obox").style.display = "block";
      document.getElementById("amsg").innerText = "OTP बन गया है, नीचे डालकर Verify करें।";
    }

    function verOtp() {
      const inp = document.getElementById("oinp").value.trim();
      if (!pend || inp !== otp) {
        document.getElementById("amsg").innerText = "गलत OTP";
        return;
      }
      s.users[pend.id] = { pw: pend.pw, bal: s.users[pend.id]?.bal ?? s.bal };
      s.user = pend.id;
      s.bal = s.users[pend.id].bal;
      otp = null; pend = null;
      document.getElementById("oinp").value = "";
      document.getElementById("obox").style.display = "none";
      save();
      document.getElementById("amsg").innerText = "नई ID बन गई और Login हो गया: " + s.user;
      tab("games");
    }

    function doLogin() {
      const id = document.getElementById("aid").value.trim();
      const pw = document.getElementById("apass").value.trim();
      const u = s.users[id];
      if (!u || u.pw !== pw) {
        document.getElementById("amsg").innerText = "ID या Password गलत है (पहले OTP से ID बनाएं)";
        return;
      }
      s.user = id;
      s.bal = +(u.bal ?? 500);
      save();
      document.getElementById("amsg").innerText = "Login सफल: " + id;
      tab("games");
    }

    function doLogout() {
      s.user = null;
      save();
      tab("auth");
    }

    draw();
  </script>
</body>
</html>
