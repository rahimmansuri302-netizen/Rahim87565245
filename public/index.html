<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPI QR & Withdrawal Module</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h2, h3 { margin-top: 0; color: #38bdf8; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #cbd5e1; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-qr { background: #22c55e; color: #052e16; }
    .btn-wd { background: #38bdf8; color: #082f49; }
    #qrBox {
      margin-top: 18px;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      color: #0f172a;
    }
    .uri-text {
      margin-top: 10px;
      font-size: 11px;
      word-break: break-all;
      color: #475569;
      text-align: center;
    }
    hr { border: 0; border-top: 1px solid #334155; margin: 24px 0; }
    .log-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 13px;
      border-left: 3px solid #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>असली UPI QR जनरेटर</h2>
    <label>आपका UPI ID (VPA)</label>
    <input type="text" id="upiId" placeholder="example@okaxis" />

    <label>आपका नाम (Payee Name)</label>
    <input type="text" id="payeeName" placeholder="Rafik Ali" />

    <label>रकम (₹ Amount — खाली छोड़ने पर स्कैनर खुद डालेगा)</label>
    <input type="number" id="amount" placeholder="100" min="1" step="0.01" />

    <label>नोट / Ref ID (Optional)</label>
    <input type="text" id="note" placeholder="Order101" />

    <button class="btn-qr" onclick="generateRealUPIQR()">QR कोड बनाएं</button>

    <div id="qrBox">
      <div id="qrcode"></div>
      <div class="uri-text" id="uriPreview"></div>
    </div>

    <hr />

    <h3>Withdrawal रिक्वेस्ट (Record / Queue)</h3>
    <label>जिस UPI ID पर निकालना है</label>
    <input type="text" id="wdUpi" placeholder="user@ybl" />

    <label>Withdrawal रकम (₹)</label>
    <input type="number" id="wdAmount" placeholder="250" min="1" />

    <button class="btn-wd" onclick="submitWithdrawal()">Withdrawal रिक्वेस्ट सेव करें</button>
    <div id="wdList"></div>
  </div>

  <script>
    let qrInstance = null;

    function generateRealUPIQR() {
      const pa = document.getElementById("upiId").value.trim().toLowerCase();
      const pn = document.getElementById("payeeName").value.trim();
      const amRaw = document.getElementById("amount").value.trim();
      const tn = document.getElementById("note").value.trim();

      if (!pa || !pa.includes("@")) {
        alert("कृपया सही UPI ID डालें (जैसे: name@upi या name@okicici)");
        return;
      }

      const params = new URLSearchParams();
      params.set("pa", pa);
      if (pn) params.set("pn", pn);
      if (amRaw && Number(amRaw) > 0) {
        params.set("am", Number(amRaw).toFixed(2));
      }
      params.set("cu", "INR");
      if (tn) {
        params.set("tn", tn);
        params.set("tr", tn.replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 25));
      }

      const upiUri = `upi://pay?${params.toString()}`;
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      qrInstance = new QRCode(qrContainer, {
        text: upiUri,
        width: 200,
        height: 200,
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("uriPreview").innerText = upiUri;
      document.getElementById("qrBox").style.display = "flex";
    }

    function submitWithdrawal() {
      const upi = document.getElementById("wdUpi").value.trim().toLowerCase();
      const amt = Number(document.getElementById("wdAmount").value);

      if (!upi || !upi.includes("@") || !amt || amt <= 0) {
        alert("सही UPI ID और रकम डालें।");
        return;
      }

      const refId = "WD" + Date.now().toString().slice(-6);
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `<b>#${refId}</b> — ₹${amt.toFixed(2)} → <code>${upi}</code> (Pending)`;
      document.getElementById("wdList").prepend(item);

      document.getElementById("wdUpi").value = "";
      document.getElementById("wdAmount").value = "";
    }
  </script>
</body>
</html>
